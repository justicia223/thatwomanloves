<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed ♡ — thatwomanloves</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .success-page {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px;
      position: relative;
      z-index: 1;
    }
    .success-icon { font-size: 4rem; margin-bottom: 20px; animation: bounceIn 0.8s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes bounceIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .success-title {
      font-family: var(--font-script);
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      color: var(--hot-pink);
      margin-bottom: 12px;
    }
    .success-sub {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.1rem;
      color: var(--text-mid);
      margin-bottom: 24px;
    }
    .order-badge {
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(245,184,196,0.4);
      border-radius: 16px;
      padding: 16px 28px;
      margin-bottom: 32px;
    }
    .order-label {
      font-family: var(--font-hand);
      font-size: 0.8rem;
      color: var(--text-light);
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .order-id {
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 0.05em;
    }
    .btn-home {
      display: inline-block;
      padding: 14px 36px;
      background: linear-gradient(135deg, var(--rose), var(--hot-pink));
      color: white;
      border-radius: 50px;
      font-family: var(--font-body);
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      box-shadow: 0 4px 20px rgba(232,84,122,0.3);
      transition: all 0.3s;
      letter-spacing: 0.05em;
    }
    .btn-home:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(232,84,122,0.4); }
  </style>
</head>
<body>
<div class="bg-hearts" id="bgHearts" aria-hidden="true"></div>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="brand-logo">thatwomanloves</a>
  </div>
</nav>
<main class="success-page">
  <div class="success-icon">🩰</div>
  <h1 class="success-title">order confirmed ♡</h1>
  <p class="success-sub">your dream heels are on their way to you, darling</p>
  <div class="order-badge">
    <p class="order-label">✦ order reference</p>
    <p class="order-id" id="orderId">—</p>
  </div>
  <a href="/" class="btn-home">✦ Continue Shopping ✦</a>
</main>
<footer class="footer">
  <span class="footer-brand">thatwomanloves</span>
  <div class="footer-hearts">♡ ♡ ♡</div>
</footer>
<script>
  // Show order ID from URL
  const params = new URLSearchParams(window.location.search);
  const oid = params.get('order_id');
  if (oid) document.getElementById('orderId').textContent = oid;

  // Hearts animation
  const hearts = ['♡','♥','✦','✿','🌸','💕'];
  const bg = document.getElementById('bgHearts');
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('span');
    s.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    s.style.cssText = `left:${Math.random()*100}%;animation-duration:${10+Math.random()*15}s;animation-delay:${-Math.random()*20}s;font-size:${0.7+Math.random()*1.2}rem;`;
    bg.appendChild(s);
  }
</script>
</body>
</html>
