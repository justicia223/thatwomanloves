name = "thatwomanloves-worker"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "thatwomanloves-db"
database_id   = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Static Assets (public/) served via Cloudflare Pages
# For local wrangler dev, the worker also handles static fallback
[site]
bucket = "./public"

# Secrets are set via: wrangler secret put MIDTRANS_SERVER_KEY
# For local dev, create a .dev.vars file (gitignored):
#   MIDTRANS_SERVER_KEY=SB-Mid-server-XXXXXXXXXXXXXXXXXXXX

[env.production]
name = "thatwomanloves-worker"
